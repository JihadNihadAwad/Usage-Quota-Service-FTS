# The full stack: `docker compose up --build` is the only setup step.
#   - db      postgres:17-alpine (healthcheck-gated, data on a named volume)
#   - api     node:24-alpine, entrypoint = migrate -> seed -> listen
#   - client  demo web app, talks to api over the compose network
# Opt-in profiles (never start with a plain `up`):
#   - test    db-test on localhost:5433 (integration suite)
#   - perf    k6 load-test runner (grafana/k6), scripts in performance/k6/
#
# The host dev flow (`npm run dev`) still maps db's 5432 to localhost.

name: fts

services:
  db:
    image: postgres:17-alpine
    container_name: fts-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fts
    ports:
      - '5432:5432'
    volumes:
      - fts_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d fts']
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
    networks:
      - fts_net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fts-api
    environment:
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgres://postgres:postgres@db:5432/fts
      # Pool size is the api's throughput knob once per-account locks stop
      # being the ceiling; 10 is pg's default. Override from the host for
      # capacity experiments:  POOL_MAX=50 docker compose up -d api
      POOL_MAX: ${POOL_MAX:-10}
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # busybox wget: non-zero exit on any 4xx/5xx, so a not-ready (503)
      # container correctly reports unhealthy.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/readyz']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M
    networks:
      - fts_net

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: fts-client
    environment:
      CLIENT_PORT: 3001
      USAGE_API_URL: http://api:3000/v1
      STATIC_DIR: /app/public
    ports:
      - '3001:3001'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/api/scenarios']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - fts_net

  k6:
    # Load-test runner. Opt-in via the perf profile so a plain
    # `docker compose up` never starts it. `compose run` starts the api and
    # db dependencies automatically; the stages themselves are run through
    # the bench:* npm scripts, which pass the script path as the command.
    image: grafana/k6:1.4.0
    profiles: ['perf']
    volumes:
      - ./performance:/perf
    environment:
      BASE_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - fts_net

  db-test:
    image: postgres:17-alpine
    container_name: fts-db-test
    profiles: ['test']
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fts_test
    ports:
      - '5433:5432'
    volumes:
      - fts_pg_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d fts_test']
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    networks:
      - fts_net

volumes:
  fts_pg_data:
  fts_pg_test_data:

networks:
  fts_net:
    driver: bridge
